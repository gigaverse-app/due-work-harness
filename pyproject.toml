[build-system]
requires = ["hatchling>=1.25", "hatch-vcs>=0.4"]
build-backend = "hatchling.build"

[project]
name = "due-work-harness"
# The version is the release tag (vX.Y.Z), written by release-please; see RELEASING.md.
dynamic = ["version"]
description = "Conformance proofs for background work that must survive lost messages, dead workers and uncertain external calls."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.11"
authors = [{ name = "Gigaverse" }]
keywords = ["background jobs", "task queue", "durable execution", "testing", "pytest", "crash testing", "outbox", "rq", "redis"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Framework :: Pytest",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Testing",
]
# The core imports no framework: its dependencies are pytest and pydantic. Every
# integration lives behind an extra and is imported only when its framework is installed.
dependencies = ["pytest>=8", "pydantic>=2.11"]

[project.optional-dependencies]
exploration = ["hypothesis>=6.112"]
django = ["django>=4.2", "pytest-django>=4.8", "psycopg[binary]>=3.1", "time-machine>=2.10"]
celery = ["celery>=5.3"]
procrastinate = ["procrastinate>=3.0"]
dbos = ["dbos>=2.0"]
redis = ["redis>=5.0", "time-machine>=2.10"]
rq = ["rq>=2.6", "redis>=5.0", "time-machine>=2.10"]
# The wire adapter binds PyMongo's 4.x connection API; 4.18 replaced its bulk-write boundary.
mongodb = ["pymongo>=4.9,<4.18", "motor>=3.7,<4"]
prefect = ["prefect>=3.7,<3.8"]
aiokafka = ["aiokafka>=0.12,<0.15"]

[project.urls]
Homepage = "https://github.com/gigaverse-app/due-work-harness"
Issues = "https://github.com/gigaverse-app/due-work-harness/issues"

[project.scripts]
due-work-harness = "due_work_harness.coverage.cli:main"

[project.entry-points.pytest11]
due_work_harness = "due_work_harness.pytest_plugin"

[dependency-groups]
lint = ["ruff>=0.8", "pyrefly>=1.0,<2", "django-stubs>=5.1", "celery-types>=0.22"]
# The demo applications' own runtimes; procrastinate is installed from the pinned
# demo checkout (its demos ship only in the source tree) by the demos CI job.
demos = [
    "dbos==3.1.0",
    "django-tasks-db==0.13.0",
    "fastapi[standard]>=0.115.0",
    "wagtail==8.0",
]
# Adopters split sessions across workers; the verify option must hold there too.
xdist = ["pytest-xdist>=3.6"]
dev = [{ include-group = "lint" }, { include-group = "xdist" }]

[tool.uv]
default-groups = ["dev"]

[tool.hatch.version]
source = "vcs"

[tool.hatch.version.raw-options]
# Untagged commits build as the next patch dev release, never as a real version.
local_scheme = "no-local-version"

[tool.hatch.build.targets.wheel]
packages = ["src/due_work_harness"]

[tool.hatch.build.targets.sdist]
# The README's recorded demo is a picture of the demos, not part of them; demos/test_readme_gif.py
# needs only the tape and its environment, which ship.
exclude = ["docs/demo.gif"]

[tool.ruff]
line-length = 120
target-version = "py311"
extend-exclude = ["demos/.upstream", ".venv*"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# The Django self-tests and demos import their settings modules from the repository root.
pythonpath = ["."]
addopts = "-p no:cacheprovider"

[tool.pyrefly]
project-includes = ["src", "tests", "tests_support", "demos", "scripts"]
# The Saleor demo runs in Saleor's own environment and is type-checked there (see its pyproject.toml).
project-excludes = ["demos/.upstream/**", "demos/saleor_checkout/**", "**/__pycache__/**", ".venv*/**"]
python-version = "3.11"
python-platform = "linux"
# tests_support holds the sample production package the binding self-tests import;
# the DBOS demo imports the upstream demo module from its pinned checkout.
search-path = ["src", ".", "tests_support", "demos/.upstream/dbos-demo-apps/python/transactional-outbox"]
