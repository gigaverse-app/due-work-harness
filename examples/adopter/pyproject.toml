[project]
name = "adopter-example"
version = "0.0.0"
description = "A minimal project adopting pytest-obligation, used by the harness's own CI to exercise its GitHub Actions."
requires-python = ">=3.12"
dependencies = []

[project.optional-dependencies]
exploration = ["pytest-obligation[exploration]"]

[dependency-groups]
dev = ["pytest-obligation"]

[tool.uv]
package = false

[tool.uv.sources]
# A real project depends on the released package: `uv add --dev "pytest-obligation[django]"`.
pytest-obligation = { path = "../..", editable = true }

[tool.due-work-harness]
production-packages = ["adopter_app"]

[tool.pytest.ini_options]
pythonpath = ["."]
